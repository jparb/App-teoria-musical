// PIANO KEYBOARD RENDERER
// Returns SVG string for a piano keyboard section
// notes: Set of semitones (0-11) to highlight; root: semitone of root
function pianoPaint(notes,root,numOctaves){
  const WW=26,WH=90,BW=15,BH=56,PAD=6;
  // Semitone → white key index within octave (-1 = black key)
  const WI=[0,-1,1,-1,2,3,-1,4,-1,5,-1,6];
  // Black key left-edge as fraction of WW from octave start (real piano proportions)
  // C#: 0.60  D#: 1.62  F#: 3.58  G#: 4.60  A#: 5.60
  const BX={1:0.60,3:1.62,6:3.58,8:4.60,10:5.60};
  const nWK=nOct=>nOct*7+1; // total white keys incl. trailing C
  const totalW=PAD*2+nWK(numOctaves)*WW;
  const totalH=PAD*2+WH+20;
  // Build white key list
  const whites=[];
  for(let oct=0;oct<numOctaves;oct++){
    for(let n=0;n<12;n++){
      if(WI[n]>=0) whites.push({note:n,x:PAD+(oct*7+WI[n])*WW});
    }
  }
  whites.push({note:0,x:PAD+numOctaves*7*WW}); // trailing C
  // Build black key list: position = PAD + octave_start + fraction * WW
  const blacks=[];
  for(let oct=0;oct<numOctaves;oct++){
    for(const [ns,frac] of Object.entries(BX)){
      blacks.push({note:parseInt(ns),x:PAD+oct*7*WW+frac*WW});
    }
  }
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${totalW} ${totalH}" width="${totalW}" height="${totalH}" style="display:block;max-width:100%">`;
  svg+=`<rect width="${totalW}" height="${totalH}" rx="4" fill="transparent"/>`;
  // White keys first (so black keys render on top)
  whites.forEach(k=>{
    const lit=notes.has(k.note),isR=k.note===root;
    const fill=isR?'#f4a300':lit?'#2a50a8':'#e8e8f2';
    const stroke='#333';
    svg+=`<rect x="${k.x}" y="${PAD}" width="${WW-1}" height="${WH}" rx="3" fill="${fill}" stroke="${stroke}" stroke-width="0.8"/>`;
    if(lit){const nm=dN(k.note),tc=isR?'#000':'#a8d0ff';svg+=`<text x="${k.x+WW/2-0.5}" y="${PAD+WH-8}" text-anchor="middle" fill="${tc}" font-size="9" font-family="'Courier New',monospace" font-weight="bold">${nm}</text>`;}
  });
  // Black keys on top
  blacks.forEach(k=>{
    const lit=notes.has(k.note),isR=k.note===root;
    const fill=isR?'#c07800':lit?'#1a3d80':'#181828';
    svg+=`<rect x="${k.x}" y="${PAD}" width="${BW}" height="${BH}" rx="2" fill="${fill}" stroke="#111" stroke-width="0.8"/>`;
    if(lit){const nm=dN(k.note),tc=isR?'#ffe080':'#7ab8ff';svg+=`<text x="${k.x+BW/2}" y="${PAD+BH-7}" text-anchor="middle" fill="${tc}" font-size="7" font-family="'Courier New',monospace" font-weight="bold">${nm}</text>`;}
  });
  svg+='</svg>';
  return{svg,width:totalW};
}


function renderPianoScale(root,intervals,scaleName){
  const notes=new Set(intervals.map(i=>(root+i)%12));
  const {svg}=pianoPaint(notes,root,2); // 2 octaves from C4
  const chips=intervals.map((iv,idx)=>{const n=(root+iv)%12;return`<span class="nchip${idx===0?' root':''}">${dN(n)}</span>`;});
  document.getElementById('fb').innerHTML=`<div class="piano-wrap">${svg}<div class="piano-legend"><span class="pl-dot" style="background:#f4a300"></span>Tónica &nbsp;<span class="pl-dot" style="background:#2a4a8a"></span>Notas de la escala</div></div>`;
  document.getElementById('si').innerHTML=`<span style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--tx2)">Notas:</span>`+chips.join('')+`<span style="margin-left:auto;font-size:11px;color:var(--tx2)">${scaleName} · ${intervals.length} notas</span>`;
}

function renderPianoChords(root,formula,chordType){
  const baseNotes=formula.map(i=>(root+i)%12);
  const grid=document.getElementById('cg');
  // Build inversions: rotate formula so each chord tone is the bass
  const coreCount=[...new Set(formula.filter(i=>i<12))].length;
  let items=[];
  for(let inv=0;inv<Math.min(coreCount,4);inv++){
    const rotated=[...formula.slice(inv).map(i=>i-formula[inv]),...formula.slice(0,inv).map(i=>i-formula[inv]+12)].sort((a,b)=>a-b);
    const noteSet=new Set(rotated.map(i=>(root+i)%12));
    const bassNote=(root+formula[inv])%12;
    const invLabels=['Pos. fund.','1ª inv.','2ª inv.','3ª inv.'];
    const {svg}=pianoPaint(noteSet,bassNote,2);
    items.push({svg,label:invLabels[inv]||''});
  }
  if(!items.length){
    grid.innerHTML='<div style="padding:20px;color:var(--tx2)">Sin notas para mostrar.</div>';
    return;
  }
  grid.innerHTML='<div class="piano-chord-grid">'+items.map(it=>`<div class="piano-chord-item">${it.svg}<div class="piano-chord-lbl">${it.label}</div></div>`).join('')+'</div>';
}

// MODULE 1: SCALES
function renderScale(){
  const root=+document.getElementById('sr').value;
  const sname=document.getElementById('st').value;
  const nf=+document.getElementById('sf').value;
  const ivs=SCALES[sname];if(!ivs)return;
  if(instS==='piano'){renderPianoScale(root,ivs,sname);return;}
  const tones=new Set(ivs.map(i=>(root+i)%12));
  const LP=48,TP=28,BP=16,FG=54,SG=34,CR=13;
  const W=LP+nf*FG+12,H=TP+5*SG+BP;
  const sy=Array.from({length:6},(_,v)=>TP+v*SG);
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="min-width:${W}px;display:block">`;
  svg+=`<rect width="${W}" height="${H}" fill="#101018" rx="6"/>`;
  [3,5,7,9,12,15,17,19,21,24].forEach(f=>{
    if(f>nf)return;const x=LP+(f-.5)*FG,my=(sy[2]+sy[3])/2;
    if(f===12||f===24){svg+=`<circle cx="${x}" cy="${sy[1]}" r="3.5" fill="#1e1e30"/>`;svg+=`<circle cx="${x}" cy="${sy[4]}" r="3.5" fill="#1e1e30"/>`;}
    else svg+=`<circle cx="${x}" cy="${my}" r="3.5" fill="#1e1e30"/>`;
  });
  for(let f=1;f<=nf;f++)svg+=`<text x="${LP+(f-.5)*FG}" y="${TP-8}" text-anchor="middle" fill="#3a3a5a" font-size="9" font-family="'Courier New',monospace">${f}</text>`;
  svg+=`<rect x="${LP-1.5}" y="${sy[0]-5}" width="3" height="${sy[5]-sy[0]+10}" fill="#a8a8c0" rx="1"/>`;
  for(let f=1;f<=nf;f++)svg+=`<line x1="${LP+f*FG}" y1="${sy[0]}" x2="${LP+f*FG}" y2="${sy[5]}" stroke="#1e1e32" stroke-width="1"/>`;
  const stk=[0.8,1.0,1.3,1.6,2.0,2.5],vlbl=['e','B','G','D','A','E'];
  for(let v=0;v<6;v++){
    svg+=`<line x1="${LP}" y1="${sy[v]}" x2="${LP+nf*FG}" y2="${sy[v]}" stroke="#606080" stroke-width="${stk[v]}"/>`;
    svg+=`<text x="13" y="${sy[v]+4}" text-anchor="middle" fill="#707090" font-size="10" font-family="'Courier New',monospace" font-weight="bold">${vlbl[v]}</text>`;
  }
  for(let v=0;v<6;v++){
    const ms=5-v,open=OS[ms];
    for(let f=0;f<=nf;f++){
      const note=(open+f)%12;if(!tones.has(note))continue;
      const x=f===0?LP-20:LP+(f-.5)*FG,y=sy[v];
      const isR=note===root,dg=(note-root+12)%12,dl=DEG[dg];
      const fill=isR?'#f4a300':'#162240',strk=isR?'#f4a300':'#5b8af5',tc=isR?'#000':'#c8d8ff';
      svg+=`<circle cx="${x}" cy="${y}" r="${CR}" fill="${fill}" stroke="${strk}" stroke-width="1.5"><title>${dN(note)} \u2014 ${dl}</title></circle>`;
      svg+=`<text x="${x}" y="${y+3.5}" text-anchor="middle" fill="${tc}" font-size="${dl.length>2?7:8}" font-family="'Courier New',monospace" font-weight="bold" pointer-events="none">${dl}</text>`;
    }
  }
  svg+='</svg>';
  document.getElementById('fb').innerHTML=svg;
  const chips=ivs.map((iv,idx)=>{const n=(root+iv)%12;return`<span class="nchip${idx===0?' root':''}">${dN(n)}</span>`;});
  document.getElementById('si').innerHTML=`<span style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--tx2)">Notas:</span>`+chips.join('')+`<span style="margin-left:auto;font-size:11px;color:var(--tx2)">${sname} \u00b7 ${ivs.length} notas</span>`;
}

// MODULE 2: CHORDS (4-finger limit)
function noIntMute(grip){
  let f=-1,l=-1;for(let i=0;i<6;i++){if(grip[i]){if(f<0)f=i;l=i;}}
  if(f<0)return false;for(let i=f+1;i<l;i++){if(!grip[i])return false;}return true;
}
// findBarre defined before countFingers (dependency)
function findBarre(v){
  const frets=v.map(o=>o?o.fret:-1);
  const fretted=frets.filter(f=>f>0);if(!fretted.length)return null;
  const minF=Math.min(...fretted);
  const minStr=frets.indexOf(minF),maxStr=frets.lastIndexOf(minF);
  if(minStr===maxStr)return null;
  for(let i=minStr;i<=maxStr;i++){if(frets[i]<0)return null;}
  return{fret:minF,from:minStr,to:maxStr};
}
// Count actual fingers needed (barre = 1 finger)
function countFingers(grip){
  const barre=findBarre(grip);
  const frets=grip.filter(x=>x&&x.fret>0).map(x=>x.fret);
  if(!frets.length)return 0;
  if(barre){
    return 1+new Set(frets.filter(f=>f!==barre.fret)).size;
  }
  return new Set(frets).size;
}
function genAtPosition(root,formula,pos,span){
  const uT=[...new Set(formula.map(i=>(root+i)%12))];
  const nFI={};formula.forEach((iv,idx)=>{const n=(root+iv)%12;if(!(n in nFI))nFI[n]=idx;});
  const req=new Set([uT[0]]);if(uT.length>=2)req.add(uT[1]);
  const perStr=OS.map(open=>{
    const opts=[];
    for(let f=pos;f<=pos+span;f++){
      if(pos>0&&f===0)continue;
      const n=(open+f)%12;
      if(uT.includes(n))opts.push({fret:f,note:n,fi:nFI[n]});
    }
    return opts;
  });
  const results=[];
  function bt(s,grip,lo,hi){
    if(results.length>=6)return;
    if(s===6){
      if(!noIntMute(grip))return;
      const pl=grip.filter(Boolean);if(pl.length<3)return;
      if(countFingers(grip)>4)return;  // 4-finger hard limit
      const cov=new Set(pl.map(x=>x.note));
      for(const r of req)if(!cov.has(r))return;
      results.push(grip.slice());return;
    }
    for(const opt of perStr[s]){
      let nl=lo,nh=hi;
      if(opt.fret>0){
        nl=lo===null?opt.fret:Math.min(lo,opt.fret);
        nh=hi===null?opt.fret:Math.max(hi,opt.fret);
        if(nh-nl>span)continue;
      }
      grip.push(opt);bt(s+1,grip,nl,nh);grip.pop();
    }
    grip.push(null);bt(s+1,grip,lo,hi);grip.pop();
  }
  bt(0,[],null,null);return results;
}
function genVoicings(root,formula){
  const seen=new Set();const all=[];
  for(const pos of[0,1,2,3,4,5,7,9,12]){
    for(const v of genAtPosition(root,formula,pos,4)){
      const k=v.map(x=>x?x.fret:-1).join(',');
      if(!seen.has(k)){seen.add(k);all.push(v);}
    }
  }
  all.sort((a,b)=>{
    const ap=a.filter(Boolean).length,bp=b.filter(Boolean).length;if(bp!==ap)return bp-ap;
    const af=a.filter(x=>x&&x.fret>0).map(x=>x.fret);
    const bf=b.filter(x=>x&&x.fret>0).map(x=>x.fret);
    return(af.length?Math.min(...af):99)-(bf.length?Math.min(...bf):99);
  });
  return all.slice(0,24);
}
function getSF(v){const fs=v.filter(x=>x&&x.fret>0).map(x=>x.fret);if(!fs.length)return 0;const mn=Math.min(...fs),mx=Math.max(...fs);return mx<=5?0:mn;}
function drawBox(v,root,formula){
  const BW=90,BH=116,SX=[10,22,34,46,58,70],TY=30,RH=14,NR=5,NR2=6.5;
  const sf=getSF(v),isOpen=sf===0,barre=findBarre(v);
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${BW} ${BH}" width="${BW}" height="${BH}">`;
  s+=`<rect width="${BW}" height="${BH}" fill="#101018" rx="4"/>`;
  if(!isOpen&&sf>0)s+=`<text x="4" y="${TY+10}" font-size="8" fill="#666" font-family="'Courier New',monospace">${sf}fr</text>`;
  if(isOpen)s+=`<rect x="${SX[0]}" y="${TY-2.5}" width="${SX[5]-SX[0]}" height="3" fill="#aaaacc" rx="1"/>`;
  for(let r=0;r<=NR;r++)s+=`<line x1="${SX[0]}" y1="${TY+r*RH}" x2="${SX[5]}" y2="${TY+r*RH}" stroke="#222238" stroke-width=".7"/>`;
  const stk2=[1.8,1.5,1.2,1.0,0.8,0.6];
  for(let si=0;si<6;si++)s+=`<line x1="${SX[si]}" y1="${TY}" x2="${SX[si]}" y2="${TY+NR*RH}" stroke="#444458" stroke-width="${stk2[si]}"/>`;
  if(barre){const barRow=isOpen?barre.fret:(barre.fret-sf+1);if(barRow>=1&&barRow<=NR){const barY=TY+(barRow-.5)*RH;s+=`<rect x="${SX[barre.from]-5}" y="${barY-5.5}" width="${SX[barre.to]-SX[barre.from]+10}" height="11" rx="5.5" fill="#f4a300" fill-opacity=".85"/>`;}}
  for(let si=0;si<6;si++){
    const opt=v[si];const x=SX[si];
    if(!opt){s+=`<text x="${x}" y="21" text-anchor="middle" fill="#383848" font-size="11">\u00d7</text>`;}
    else if(opt.fret===0){s+=`<circle cx="${x}" cy="17" r="4" fill="none" stroke="#555" stroke-width="1.2"/>`;}
    else{
      const row=isOpen?opt.fret:(opt.fret-sf+1);
      if(row>=1&&row<=NR){
        const dy=TY+(row-.5)*RH,isR=opt.note===root,isE=formula[opt.fi]>=9;
        const onBarre=barre&&opt.fret===barre.fret&&si>=barre.from&&si<=barre.to;
        const nt=dN(opt.note);
        if(onBarre){s+=`<text x="${x}" y="${dy+3.5}" text-anchor="middle" fill="${isR?'#000':'#fff'}" font-size="${nt.length>2?5:6}" font-family="'Courier New',monospace" font-weight="bold" pointer-events="none">${nt}</text>`;}
        else{const fill=isR?'#f4a300':isE?'#162240':'#252535';const strk=isR?'#f4a300':isE?'#5b8af5':'#555';const tc=isR?'#000':'#ccd4f0';s+=`<circle cx="${x}" cy="${dy}" r="${NR2}" fill="${fill}" stroke="${strk}" stroke-width="1"/>`;s+=`<text x="${x}" y="${dy+2.5}" text-anchor="middle" fill="${tc}" font-size="${nt.length>2?5.5:6.5}" font-family="'Courier New',monospace" font-weight="bold" pointer-events="none">${nt}</text>`;}
      }
    }
  }
  s+='</svg>';return s;
}
function invLbl(v,root,formula){
  const bass=v.find(Boolean);if(!bass)return '';
  const bi=(bass.note-root+12)%12;
  const core=[...new Set(formula.filter(i=>i<12))].sort((a,b)=>a-b);
  const pos=core.indexOf(bi);
  const bl=(['Pos. fund.','1\u00aa inv.','2\u00aa inv.','3\u00aa inv.','4\u00aa inv.'][pos]??'Bajo ext.');
  const barre=findBarre(v);
  return bl+(barre?` \u00b7 Cejilla ${barre.fret}`:'');
}
function renderChords(){
  const root=+document.getElementById('cr').value;
  const ct=document.getElementById('ct').value;
  const cd=CHORDS[ct];if(!cd)return;
  const f=cd.f;
  if(instC==='piano'){const chips=f.map(i=>(root+i)%12).map((n,i)=>`<span class="nchip${i===0?' root':''}">${dN(n)}<sup style="font-size:9px;opacity:.65;margin-left:1px">${DEG[f[i]%12]||''}</sup></span>`).join('');document.getElementById('ci').innerHTML=`<b>${dN(root)} ${ct}</b> &nbsp; ${chips} &nbsp; <span style="font-size:11px;color:var(--tx2)">[${f.map(i=>DEG[i%12]||i).join(' — ')}]</span>`;renderPianoChords(root,f,ct);return;}
  const chips=f.map(i=>(root+i)%12).map((n,i)=>`<span class="nchip${i===0?' root':''}">${dN(n)}<sup style="font-size:9px;opacity:.65;margin-left:1px">${DEG[f[i]%12]||''}</sup></span>`).join('');
  document.getElementById('ci').innerHTML=`<b>${dN(root)} ${ct}</b> &nbsp; ${chips} &nbsp; <span style="font-size:11px;color:var(--tx2)">[${f.map(i=>DEG[i%12]||i).join(' \u2014 ')}]</span>`;
  const vs=genVoicings(root,f);
  const grid=document.getElementById('cg');
  if(!vs.length){grid.innerHTML='<div style="padding:30px;color:var(--tx2);font-size:13px">Sin digitaciones con 4 dedos encontradas.</div>';return;}
  grid.innerHTML=vs.map(v=>`<div class="cbw">${drawBox(v,root,f)}<div class="cbl">${invLbl(v,root,f)}</div></div>`).join('');
}

// MODULE 3: SUBSTITUTIONS & ENRICHMENT
const NOTE_MAP={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function parseKey(str){
  str=str.trim();if(!str)return null;
  const m=str.match(/^([A-Ga-g][#b]?)\s*(m(?:in(?:or)?)?)?$/i);
  if(!m)return null;
  const rStr=m[1].charAt(0).toUpperCase()+m[1].slice(1);
  const root=NOTE_MAP[rStr];if(root===undefined)return null;
  return{root,isMinor:!!(m[2]),display:rStr+(m[2]?'m':'')};
}
function getEnrichFamily(type){
  if(ENRICH[type])return ENRICH[type];
  if(type==='mMaj7'||type==='mM7')return ENRICH['mMaj7']||[];
  if(type.includes('dim')||type.includes('\u00b0'))return ENRICH['Disminuido']||[];
  if(type.includes('\u00f8')||type==='m7b5 (\u00f87)')return ENRICH['m7b5 (\u00f87)']||[];
  if(type.includes('aug'))return ENRICH['Aumentado']||[];
  if(type==='sus2')return ENRICH['sus2'];
  if(type==='sus4')return ENRICH['sus4'];
  if(type.startsWith('m')&&!type.startsWith('maj'))return ENRICH['m7']||[];
  if(type.includes('maj7')||type.startsWith('maj'))return ENRICH['maj7']||[];
  if(type.includes('7'))return ENRICH['7 dominante']||[];
  return ENRICH['Mayor']||[];
}
function buildEnrichItems(root,type){
  return getEnrichFamily(type).filter(e=>e.t!==type).map(e=>({
    root,type:e.t,name:sN(root,e.t),rn:'',color:'#f4a300',desc:e.d
  }));
}
function buildFunctionalItems(root,type,key,myDeg,degrees){
  if(!myDeg){
    return degrees.map(d=>{
      const r=(key.root+d.int)%12;
      return{root:r,type:d.type,name:sN(r,d.type),rn:d.rn,color:'#5b8af5',desc:d.desc};
    });
  }
  return degrees.filter(d=>d.fn===myDeg.fn&&d.int!==myDeg.int).flatMap(d=>{
    const r=(key.root+d.int)%12;
    const ext={Mayor:'maj7',Menor:'m7',Disminuido:'m7b5 (\u00f87)'}[d.type];
    const out=[{root:r,type:d.type,name:sN(r,d.type),rn:d.rn,color:'#5b8af5',desc:d.desc}];
    if(ext)out.push({root:r,type:ext,name:sN(r,ext),rn:d.rn+'+7\u00aa',color:'#5b8af5',desc:d.desc+' con 7\u00aa a\u00f1adida'});
    return out;
  });
}
function buildModalItems(root,type,key){
  const src=key.isMinor?MAJ_DEG:MIN_DEG;
  const tgt=key.isMinor?MIN_DEG:MAJ_DEG;
  const mode=key.isMinor?'mayor paralelo':'menor paralelo';
  return src.filter(d=>!tgt.find(td=>td.int===d.int&&td.type===d.type)).map(d=>{
    const r=(key.root+d.int)%12;
    return{root:r,type:d.type,name:sN(r,d.type),rn:`${d.rn} (${mode})`,color:'#9b7feb',
      desc:`Prestado del modo ${mode}. Intercambio modal.`};
  });
}
function buildAdvancedItems(root,type,key,myDeg){
  const items=[];
  const isDom=type.includes('7')&&!type.includes('maj7')&&!type.includes('dim7')&&!type.includes('\u00f8');
  if(isDom){
    const tRoot=(root+6)%12;
    items.push({root:tRoot,type:'7 dominante',name:sN(tRoot,'7 dominante'),rn:'Sustituto tritonal',color:'#e29046',
      desc:'Mismo tritono interno, bajo desciende por semitono. Movimiento crom\u00e1tico.'});
  }
  const secDom=(root+7)%12;
  if(secDom!==root){
    const lbl=myDeg?`V/${myDeg.rn}`:'Dom. secundaria';
    items.push({root:secDom,type:'7 dominante',name:sN(secDom,'7 dominante'),rn:lbl,color:'#e29046',
      desc:`Dominante secundaria. Toniciza ${dN(root)} localmente.`});
  }
  const neap=(key.root+1)%12;
  if(neap!==root){
    items.push({root:neap,type:'Mayor',name:sN(neap,'Mayor'),rn:'Napolitano (\u266dII)',color:'#e29046',
      desc:'Subdominante alterada frigia. Muy expresivo en cadencias pre-dominantes.'});
  }
  const bd=(key.root+10)%12;
  if(bd!==root&&bd!==secDom){
    items.push({root:bd,type:'7 dominante',name:sN(bd,'7 dominante'),rn:'Backdoor dominant (\u266dVII7)',color:'#e29046',
      desc:'Resuelve a I desde \u266dVII. Blues, jazz, soul. Alternativa suave al V7.'});
  }
  const isMinorChord=type.startsWith('m')&&!type.startsWith('maj')&&!type.startsWith('aug');
  const parType=isMinorChord?'Mayor':'Menor';
  if(type==='Mayor'||type==='Menor'||type==='maj7'||type==='m7'){
    items.push({root,type:parType,name:sN(root,parType),rn:'Paralelo (misma ra\u00edz)',color:'#e29046',
      desc:`Misma ra\u00edz, calidad ${parType.toLowerCase()}. Intercambio modal directo.`});
  }
  return items.filter(it=>!(it.root===root&&it.type===type));
}
function renderSubSec(title,items){
  if(!items.length)return '';
  const cards=items.map(it=>{
    const st=it.type.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return `<div class="sub-card" style="border-color:${it.color}35;color:${it.color}" onclick="loadChord(${it.root},'${st}')"><div class="sub-cn">${it.name}</div>${it.rn?`<div class="sub-rn">${it.rn}</div>`:''}<div class="sub-cd">${it.desc}</div><div class="sub-hint">\u2192 Ver digitaciones</div></div>`;
  }).join('');
  return `<div class="sub-sec"><div class="sub-hdr">${title}<span class="sub-cnt">${items.length}</span></div><div class="sub-grid">${cards}</div></div>`;
}
function loadChord(root,type){
  document.getElementById('cr').value=root;
  const sel=document.getElementById('ct');let found=false;
  for(const o of sel.options){if(o.value===type){sel.value=type;found=true;break;}}
  if(found)renderChords();
  switchTab('c');
}
function renderSubs(){
  const root=+document.getElementById('gr').value;
  const type=document.getElementById('gc').value;
  const keyStr=document.getElementById('gk').value.trim();
  const area=document.getElementById('sg');
  const parts=[];
  if(keyStr){
    const key=parseKey(keyStr);
    if(!key){
      parts.push('<div class="perr">Tonalidad no reconocida. Ejemplos: C \u00b7 Am \u00b7 F#m \u00b7 Bb \u00b7 Ebm</div>');
    }else{
      const interval=(root-key.root+12)%12;
      const degrees=key.isMinor?MIN_DEG:MAJ_DEG;
      const myDeg=degrees.find(d=>d.int===interval);
      const parallelDeg=(key.isMinor?MAJ_DEG:MIN_DEG).find(d=>d.int===interval);
      const chordName=sN(root,type);
      let info;
      if(myDeg){
        const fnMap={tonic:'t\u00f3nica',predominant:'predominante',subdominant:'subdominante',dominant:'dominante',submediant:'submediante',subtonic:'subt\u00f3nica'};
        info=`<b>${chordName}</b> es el grado <em>${myDeg.rn}</em> en <b>${key.display}</b>. Funci\u00f3n: <em>${fnMap[myDeg.fn]||myDeg.fn}</em>.`;
      }else if(parallelDeg){
        const mode=key.isMinor?'mayor paralelo':'menor paralelo';
        info=`<b>${chordName}</b> no es diat\u00f3nico en <b>${key.display}</b>. Aparece como <em>${parallelDeg.rn}</em> del <em>${mode}</em> \u2014 intercambio modal t\u00edpico.`;
      }else{
        info=`<b>${chordName}</b> no es diat\u00f3nico en <b>${key.display}</b>. Uso crom\u00e1tico, dominante secundaria o rearmonizaci\u00f3n.`;
      }
      parts.push(`<div class="sub-info">${info}</div>`);
      parts.push(renderSubSec('🎨 Extensiones y variaciones',buildEnrichItems(root,type)));
      const ft=myDeg?`🔄 Misma funci\u00f3n en ${key.display}`:`🔄 Acordes diat\u00f3nicos de ${key.display}`;
      parts.push(renderSubSec(ft,buildFunctionalItems(root,type,key,myDeg,degrees)));
      parts.push(renderSubSec('🎭 Intercambio modal',buildModalItems(root,type,key)));
      parts.push(renderSubSec('\u26a1 Sustituciones avanzadas',buildAdvancedItems(root,type,key,myDeg)));
    }
  }else{
    parts.push(renderSubSec('🎨 Extensiones y variaciones',buildEnrichItems(root,type)));
    parts.push('<div class="sub-info" style="margin-top:14px">Introduce una tonalidad para ver funci\u00f3n en la clave, intercambio modal y sustituciones avanzadas.</div>');
  }
  area.innerHTML=parts.join('')||'<div class="empty">Selecciona un acorde.</div>';
}

// MODULE 4: PROGRESSIONS
let activeFilter=0;
function chordFnColor(off){return({0:'#f4a300',5:'#5b8af5',7:'#e24b4a',2:'#5b8af5',9:'#f4a300',4:'#9b7feb',11:'#e24b4a',3:'#9b7feb',8:'#9b7feb',10:'#9b7feb',1:'#3db86a',6:'#3db86a'})[off]||'var(--tx2)';}
function buildFilterBar(progs){
  const counts={1:0,2:0,3:0};progs.forEach(p=>{counts[p.tier||2]++;});
  document.getElementById('pfilter').innerHTML=
    `<span class="pftag${activeFilter===0?' on':''}" onclick="setFilter(0)">Todo (${progs.length})</span>`+
    [['1','Ic\u00f3nicas'],['2','Variantes'],['3','Avanzadas']].map(([t,l])=>
      counts[+t]>0?`<span class="pftag${activeFilter===+t?' on':''}" onclick="setFilter(${t})">${l} (${counts[+t]})</span>`:''
    ).join('');
}
function setFilter(t){activeFilter=t;renderProgs();}
function renderProgs(){
  const keyStr=document.getElementById('pr').value;
  const style=document.getElementById('ps').value;
  const area=document.getElementById('pg');
  if(!keyStr.trim()){area.innerHTML='<div class="empty">Introduce un tono para ver progresiones.</div>';return;}
  const key=parseKey(keyStr);
  if(!key){area.innerHTML='<div class="perr">Tono no reconocido. Ej: C \u00b7 Am \u00b7 F#m \u00b7 Bb \u00b7 Ebm</div>';return;}
  const sd=PROGS[style];if(!sd)return;
  const allProgs=key.isMinor?(sd.minor&&sd.minor.length?sd.minor:sd.major):sd.major;
  if(!allProgs||!allProgs.length){area.innerHTML='<div class="empty">Sin progresiones para este estilo y tonalidad.</div>';return;}
  buildFilterBar(allProgs);
  const progs=activeFilter===0?allProgs:allProgs.filter(p=>(p.tier||2)===activeFilter);
  if(!progs.length){area.innerHTML='<div class="empty">Sin progresiones para este filtro.</div>';return;}
  const TL={1:'Ic\u00f3nica',2:'Variante',3:'Avanzada'},TC={1:'t1',2:'t2',3:'t3'};
  let html=`<div class="pcnt">${progs.length} progresiones en <b>${key.display}</b> ${key.isMinor?'menor':'mayor'} \u00b7 ${sd.label}</div>`;
  progs.forEach(prog=>{
    const tier=prog.tier||2;
    const chords=prog.chords.map(([rn,off,t])=>({rn,name:dN((key.root+off)%12)+t,off}));
    html+=`<div class="pc"><div class="pn">${prog.name}<span class="ptier ${TC[tier]}">${TL[tier]}</span></div><div class="pd">${prog.desc}</div><div class="pseq">`;
    chords.forEach((c,i)=>{
      if(prog.perRow&&i>0&&i%prog.perRow===0)html+=`<div class="pbar-brk"></div>`;
      const col=chordFnColor(c.off);
      html+=`<div class="pchip" style="color:${col};border-color:${col}40"><span class="pchip-name">${c.name}</span><span class="pchip-rn">${c.rn}</span></div>`;
      if(i<chords.length-1&&!(prog.perRow&&(i+1)%prog.perRow===0))html+=`<span class="parrow">\u2013</span>`;
    });
    html+=`</div></div>`;
  });
  area.innerHTML=html;
}

// INIT
function init(){
  fillRoot('sr');fillRoot('cr');fillRoot('gr');
  fillScales();fillChords('ct');fillChords('gc');fillStyles();
  renderScale();
}
init();
</script>
